const pad=n=>String(n).padStart(2,'0');const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};const fmt=s=>{const d=new Date(s+'T00:00:00');return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${'日一二三四五六'[d.getDay()]}）`};
let selected=days.findIndex(x=>x.date==='2026-11-02'); if(selected<0)selected=0;
function tasksFor(day){return [ {name:'數學 A',duration:'90 分鐘',items:[day.math,'完成 5–10 題基礎練習或指定題型','訂正錯題：寫下錯誤原因，隔天重做']},{name:'英文',duration:'50 分鐘',items:[day.lang,'整理今天不熟悉的單字／句型']},{name:'國文',duration:'40 分鐘',items:['完成當日指定閱讀或文言文練習','記錄文意判讀、字詞或寫作素材']},{name:'自然',duration:'50 分鐘',items:[day.science,'完成章節題組，整理圖表與重要觀念']}]}
function taskId(day,si,ti){return `${day.date}-${si}-${ti}`}function isDone(id){return !!state.done[id]}function setDone(id,v){if(v)state.done[id]=true;else delete state.done[id];save();renderToday();}
function renderHeader(){let total=0,done=0;days.forEach(d=>tasksFor(d).forEach((g,si)=>g.items.forEach((_,ti)=>{total++;if(isDone(taskId(d,si,ti)))done++;})));document.getElementById('allPct').textContent=Math.round(done/total*100)+'%';document.getElementById('doneCount').textContent=done;document.getElementById('daysLeft').textContent=Math.max(0,Math.ceil((exam-new Date())/86400000));}
function renderToday(){const d=days[selected];document.getElementById('dateTitle').textContent=fmt(d.date);document.getElementById('phaseTag').textContent=d.phase;document.getElementById('todayHint').textContent=d.label;const groups=tasksFor(d);let total=0,done=0,html='',carryHtml='';const friday=d.day===4;const weekStart=0;groups.forEach((g,si)=>{if(friday)return;html+=`<div class="subject"><div class="subjecttitle">${g.name}<span>${g.duration}</span></div>`;g.items.forEach((item,ti)=>{const id=taskId(d,si,ti),checked=isDone(id);total++;if(checked)done++;html+=`<div class="task ${checked?'done':''}"><input type="checkbox" data-task="${id}" ${checked?'checked':''}><label>${item}</label></div>`;});html+='</div>';});for(let di=weekStart;di<selected;di++){const old=days[di];tasksFor(old).forEach((g,si)=>g.items.forEach((item,ti)=>{const id=taskId(old,si,ti);if(!isDone(id)){carryHtml+=`<div class="task"><input type="checkbox" data-task="${id}"><label>${item}<span class="tiny muted">（${old.date}・${g.name}）</span></label></div>`;}}));}const note=friday?'<div class="callout" style="margin:10px 0">📘 週五晚上安排英文補習，今天不排其他複習；原定任務會順延到週六。</div>':'';const carry=carryHtml?`<div class="subject"><div class="subjecttitle">↪ 本週順延待補 <span>完成後勾選即可</span></div>${carryHtml}</div>`:'';document.getElementById('tasks').innerHTML=note+html+carry;document.getElementById('dayBar').style.width=(done/Math.max(1,total)*100)+'%';document.getElementById('dayProgress').textContent=`今日完成 ${done} 項・本週待補 ${carryHtml? (carryHtml.match(/data-task=/g)||[]).length:0} 項`;
document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',e=>setDone(e.target.dataset.task,e.target.checked)));document.getElementById('prevDay').disabled=selected===0;document.getElementById('nextDay').disabled=selected===days.length-1;}
function renderCalendar(){let html='';weeks.forEach((w,wi)=>{html+=`<div class="weekblock"><div class="weektitle">${w.label}</div><div class="daylist">`;w.days.forEach((_,di)=>{const idx=wi*7+di,d=days[idx],all=tasksFor(d).every((g,si)=>g.items.every((_,ti)=>isDone(taskId(d,si,ti))));html+=`<button class="daycell ${idx===selected?'selected':''} ${all?'doneall':''}" data-day="${idx}">${Number(d.date.slice(-2))} 日</button>`;});html+='</div></div>';});document.getElementById('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);showTab('today');});}
function renderProgress(){const names=['數學 A','英文','國文','自然'];let html='';names.forEach((name,si)=>{let total=0,done=0;days.forEach(d=>{const g=tasksFor(d)[si];g.items.forEach((_,ti)=>{total++;if(isDone(taskId(d,si,ti)))done++;});});html+=`<div class="metric"><small>${name}</small><strong>${Math.round(done/total*100)}%</strong><div class="bar"><i style="width:${done/total*100}%"></i></div><small>${done}/${total} 項</small></div>`;});document.getElementById('metrics').innerHTML=html;let wh='';weeks.forEach((w,wi)=>{let total=0,done=0;w.days.forEach((_,di)=>{const d=days[wi*7+di];tasksFor(d).forEach((g,si)=>g.items.forEach((_,ti)=>{total++;if(isDone(taskId(d,si,ti)))done++;}));});wh+=`<div style="margin:12px 0"><div class="datebar"><span class="tiny">${w.label}</span><b class="tiny">${Math.round(done/total*100)}%</b></div><div class="bar"><i style="width:${done/total*100}%"></i></div></div>`;});document.getElementById('weeklyProgress').innerHTML=wh;}
function renderMistakes(){const el=document.getElementById('mistakeList');if(!state.mistakes.length){el.innerHTML='<div class="card empty">還沒有錯題紀錄。遇到不熟悉的題目時，記下章節與原因吧。</div>';return;}el.innerHTML=state.mistakes.slice().reverse().map((m,i)=>`<div class="card"><div class="datebar"><b>${esc(m.subject)}｜${esc(m.topic)}</b><button class="btn" data-del="${state.mistakes.length-1-i}">刪除</button></div><div class="tiny muted" style="margin:6px 0">${m.date}</div><div style="font-size:14px;white-space:pre-wrap">${esc(m.note||'未填寫原因')}</div></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.mistakes.splice(Number(b.dataset.del),1);save();renderMistakes();});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showTab(tab){document.querySelectorAll('main section').forEach(s=>s.classList.add('hide'));document.getElementById('view-'+tab).classList.remove('hide');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='today')renderToday();if(tab==='calendar')renderCalendar();if(tab==='progress')renderProgress();if(tab==='mistakes')renderMistakes();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.getElementById('prevDay').onclick=()=>{selected=Math.max(0,selected-1);renderToday()};document.getElementById('nextDay').onclick=()=>{selected=Math.min(days.length-1,selected+1);renderToday()};document.getElementById('todayBtn').onclick=()=>{const i=days.findIndex(d=>d.date===localDate());selected=i>=0?i:0;renderToday()};document.getElementById('addMistake').onclick=()=>{const topic=document.getElementById('mistakeTopic').value.trim();if(!topic){alert('請先填寫章節或題目');return;}state.mistakes.push({subject:document.getElementById('mistakeSubject').value,topic,note:document.getElementById('mistakeNote').value.trim(),date:fmt(localDate())});save();document.getElementById('mistakeTopic').value='';document.getElementById('mistakeNote').value='';renderMistakes();};
renderHeader();renderToday();
</script></body></html>
